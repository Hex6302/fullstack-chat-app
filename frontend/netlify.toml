[build]
  publish = "dist"
  command = "npm install && npm run build"

# API Proxy (optional - if you want to proxy API calls through Netlify)
# Replace YOUR-BACKEND-URL with your actual Render backend URL
# Example: If your backend is at https://chat-app-backend.onrender.com
# Then change the URL to: https://chat-app-backend.onrender.com/api/:splat
[[redirects]]
  from = "/api/*"
  to = "https://YOUR-BACKEND-URL.onrender.com/api/:splat"
  status = 200
  force = true

# SPA Fallback - all routes go to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "18"

# Note: The API proxy is optional if you set VITE_API_URL environment variable in Netlify.
# The frontend will use VITE_API_URL for API calls if set.

